name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check on main's branch protection. Holds no secrets: a PR from this repo can edit this file.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # The Cloudflare secrets live in the `production` environment, which only main may deploy to,
  # so no pull request can publish before the operator approves and merges it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # Full history: sitemap lastmod is each page's last commit date; a shallow clone fails the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=taxfold-app --branch=main --commit-hash="$GITHUB_SHA"
      # The privacy page promises no analytics script (the CF beacon reads device info, so ePrivacy Art. 5(3) would need consent); fail loudly if Cloudflare injects it.
      - name: Check the live site carries no Web Analytics beacon
        run: |
          page=$(curl -fsS -H 'Accept: text/html' https://taxfold.app/)
          test -n "$page"
          if printf '%s' "$page" | grep -q -E 'data-cf-beacon|cloudflareinsights'; then
            echo "::error::https://taxfold.app/ carries the Cloudflare Web Analytics beacon; turn Web Analytics off on the Pages project (the privacy page says there is no tracking script)"
            exit 1
          fi
          echo "no beacon"
